<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f5">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23111617'/%3E%3Ccircle cx='28' cy='32' r='17' fill='%23e8eeee'/%3E%3Ccircle cx='37' cy='25' r='16' fill='%23111617'/%3E%3Cpath d='M47 10l2.2 5.8L55 18l-5.8 2.2L47 26l-2.2-5.8L39 18l5.8-2.2L47 10z' fill='%23e8eeee'/%3E%3C/svg%3E">
  <title>sun &amp; moon</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292d2e;
      --muted: #73797a;
      --line: rgba(65, 75, 76, .2);
      --accent: #e1e5e5;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(70vw 60vh at 78% 18%, rgba(255, 255, 255, .92), transparent 72%),
        linear-gradient(155deg, #f4f5f5, #e8ebeb 54%, #f8f9f9);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      inset: -20%;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(ellipse at 52% 36%, rgba(255, 255, 255, .5), transparent 48%),
        radial-gradient(ellipse at 88% 64%, rgba(255, 255, 255, .3), transparent 42%);
      filter: blur(32px);
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-content: center;
      justify-items: center;
      padding: 48px 24px;
      text-align: center;
    }

    .sky-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 30px;
    }

    .orb {
      display: block;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #d7dddd);
      box-shadow: 0 0 24px rgba(60, 70, 72, .1);
    }

    .sun {
      background: #d7dddd;
    }

    .moon {
      border-radius: 0;
      background: #8e9a9c;
      box-shadow: none;
      clip-path: path("M 21 0 A 21 21 0 1 0 21 42 A 16 21 0 0 1 21 0 Z");
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .36em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1;
    }

    h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .message {
      max-width: 34ch;
      margin: 16px 0 26px;
      color: var(--muted);
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.8;
    }

    .here {
      display: inline-flex;
      min-width: 150px;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--accent);
      color: var(--ink);
      font-size: 14px;
      letter-spacing: .12em;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .here:hover {
      transform: translateY(-2px);
      background: #f8f9f9;
    }

    .here:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    /* ---------- clean, modern welcome ---------- */
    :root {
      --ink: #242b2d;
      --muted: #687174;
      --line: #d7dddd;
      --accent: #303a3c;
      --page: #f3f5f4;
    }

    body {
      background: var(--page);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      content: "";
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(71, 84, 86, .24) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(71, 84, 86, .16) 0 .8px, transparent 1.4px),
        radial-gradient(circle, rgba(71, 84, 86, .12) 0 .7px, transparent 1.3px);
      background-size: 193px 211px, 257px 239px, 311px 283px;
      background-position: 17px 31px, 89px 113px, 151px 67px;
      filter: none;
    }

    main {
      z-index: 1;
      gap: 0;
      padding: 36px 24px;
    }

    .sky-icons {
      gap: 20px;
      margin-bottom: 26px;
    }

    .orb {
      width: 38px;
      height: 38px;
      box-shadow: none;
    }

    .sun {
      background: #cbd2d2;
    }

    .moon {
      position: relative;
      border-radius: 50%;
      background: #879395;
      clip-path: none;
    }

    .moon::after {
      position: absolute;
      top: -4px;
      left: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--page);
      content: "";
    }

    .message {
      margin: 0 0 28px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(22px, 4vw, 30px);
      letter-spacing: -.025em;
      line-height: 1.3;
    }

    .here {
      min-width: 132px;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
      transition: transform .2s ease, background .2s ease;
    }

    .here:hover {
      transform: translateY(-2px);
      background: #465355;
    }

    .here:focus-visible {
      outline-color: var(--accent);
    }

  </style>
</head>

<body>
  <main>
    <div class="sky-icons" aria-hidden="true">
      <span class="orb sun"></span>
      <span class="orb moon"></span>
    </div>
    <p class="message">sun and moon.</p>
    <a class="here" href="main.html">us?</a>
  </main>
</body>

</html>
