<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f5">
  <title>sun &amp; moon</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292d2e;
      --muted: #73797a;
      --line: rgba(65, 75, 76, .2);
      --accent: #e1e5e5;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(70vw 60vh at 78% 18%, rgba(255, 255, 255, .92), transparent 72%),
        linear-gradient(155deg, #f4f5f5, #e8ebeb 54%, #f8f9f9);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      inset: -20%;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(ellipse at 52% 36%, rgba(255, 255, 255, .5), transparent 48%),
        radial-gradient(ellipse at 88% 64%, rgba(255, 255, 255, .3), transparent 42%);
      filter: blur(32px);
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-content: center;
      justify-items: center;
      padding: 48px 24px;
      text-align: center;
    }

    .sky-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 30px;
    }

    .orb {
      display: block;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #d7dddd);
      box-shadow: 0 0 24px rgba(60, 70, 72, .1);
    }

    .sun {
      background: #d7dddd;
    }

    .moon {
      border-radius: 0;
      background: #8e9a9c;
      box-shadow: none;
      clip-path: path("M 21 0 A 21 21 0 1 0 21 42 A 16 21 0 0 1 21 0 Z");
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .36em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1;
    }

    h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .message {
      max-width: 34ch;
      margin: 16px 0 26px;
      color: var(--muted);
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.8;
    }

    .here {
      display: inline-flex;
      min-width: 150px;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--accent);
      color: var(--ink);
      font-size: 14px;
      letter-spacing: .12em;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .here:hover {
      transform: translateY(-2px);
      background: #f8f9f9;
    }

    .here:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

  </style>
</head>

<body>
  <main>
    <div class="sky-icons" aria-hidden="true">
      <span class="orb sun"></span>
      <span class="orb moon"></span>
    </div>
    <p class="message">sun and moon.</p>
    <a class="here" href="main.html">us?</a>
  </main>
</body>

</html>
